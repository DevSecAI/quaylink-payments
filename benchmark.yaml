    - { id: QUAY-SAST-004, cwe: CWE-327,  severity: medium,   file: src/services/crypto.js,        line: 9,  title: "DES/MD5 for token signing" }
    - { id: QUAY-SAST-005, cwe: CWE-1321, severity: high,     file: src/services/merge.js,         line: 11, title: "Prototype pollution (recursive merge)" }
    - { id: QUAY-SAST-006, cwe: CWE-347,  severity: high,     file: src/middleware/auth.js,        line: 18, title: "JWT alg=none accepted" }
